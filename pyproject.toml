[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ininet-win"
version = "0.0.1"
description = "Windows build of ininet - network scanner & live connection monitor (TUI/CLI)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "SkilinPur", email = "rolandgroz31@gmail.com" }]
keywords = ["network", "scanner", "monitor", "tui", "cli", "security", "windows"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: System :: Networking",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
tui = ["textual>=0.80"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
ininet-win = "ininet_win.cli:main"

[project.urls]
Homepage = "https://github.com/SkilinPur/ininet-win"
Source = "https://github.com/SkilinPur/ininet-win"
Organization = "https://iniproject.ru"

[tool.hatch.build.targets.wheel]
packages = ["src/ininet_win"]

[tool.hatch.build.targets.wheel.force-include]
"src/ininet_win/i18n/locales" = "ininet_win/i18n/locales"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
